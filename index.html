/* header */
.top{flex-wrap:nowrap}.dlbtn{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 14px;border-radius:99px;border:1.5px solid #ffffff80;background:none;color:#fff;font:600 15px Rubik;cursor:pointer;white-space:nowrap;flex:none}.dlbtn:hover{background:#ffffff1a}.dlbtn .ic{width:18px;height:18px}
.acctbtn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:99px;border:0;background:var(--gold);color:#3a2a00;font:700 15px Rubik;cursor:pointer;white-space:nowrap;flex:none;max-width:180px}.acctbtn.in{background:#ffffff1a;color:#fff;padding:0 12px 0 4px}.acctbtn span{overflow:hidden;text-overflow:ellipsis}
/* start screen */
.start{position:fixed;inset:0;z-index:80;background:radial-gradient(120% 90% at 20% 0%,#16805e 0%,#0b4433 55%,#06261c 100%);color:#fff;overflow:auto;display:grid;place-items:center;padding:max(3vw,14px)}
.stbox{width:min(1120px,100%);display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:clamp(18px,4vw,48px);align-items:center}
.sbrand{display:flex;align-items:center;gap:12px;font:400 32px 'Lilita One',Rubik,sans-serif;letter-spacing:.5px}
.start h1{font:400 clamp(40px,6.4vw,84px)/1 'Lilita One',Rubik,sans-serif;margin:.3em 0 .25em;color:var(--gold);text-wrap:balance}
.spromo{font-size:clamp(16px,1.6vw,19px);max-width:60ch;color:#e6f2ec}
.stiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:18px 0}.stile{display:flex;align-items:center;gap:8px;background:var(--c);border-radius:14px;padding:8px 10px;color:#fff;text-decoration:none;font-weight:600;font-size:14px;box-shadow:0 4px 0 #0003;min-width:0}.stile span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.stile svg{flex:none}
.sbtns .btn{color:var(--ink)}.sbtns .btn.hot{color:#fff}.btn.big{min-height:52px;padding:10px 26px;font-size:18px}
.sside{background:#ffffff12;border:1px solid #ffffff2a;border-radius:20px;padding:20px;display:grid;gap:12px;justify-items:center;text-align:center}.sside .chk{color:#d6e7de;font-size:14px}
.qrcombo{display:grid;gap:10px;justify-items:center;text-align:center;max-width:340px}.qrcombo img{background:#fff;padding:8px;border-radius:12px;width:160px;height:160px;image-rendering:pixelated}.qrcombo p{margin:0;font-size:15px;line-height:1.5}
.storelink{font-weight:800;font-size:1.08em;color:var(--gold)!important;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px;padding:1px 4px;border-radius:6px;background:#ffc23d22;overflow-wrap:anywhere}
.band .storelink,.prose .storelink{color:#b36b00!important;background:#ffc23d33}
/* footer */
.foot{margin-top:auto;background:var(--felt2);color:#d6e7de;padding:32px max(3vw,16px) 24px;border-top:3px solid var(--gold)}.foot a,.foot .link{color:#fff;text-decoration:none;font-weight:500}.foot a:hover,.foot .link:hover{text-decoration:underline}
.fcols{display:grid;grid-template-columns:minmax(0,1.4fr) repeat(4,minmax(0,1fr));gap:24px}.foot h4{color:var(--gold);margin:0 0 8px;font-size:15px}.foot ul{list-style:none;padding:0;margin:0;display:grid;gap:6px;font-size:15px}.fbrand b{font:400 24px 'Lilita One',Rubik}.fbrand .qrcombo{justify-items:start;text-align:left}.fbrand .qrcombo img{width:120px;height:120px}
.fcopy{margin:24px 0 0;font-size:14px;color:#a9c4b7;border-top:1px solid #ffffff22;padding-top:14px}
/* auth */
.authbox{display:grid;gap:4px}.social{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:8px;margin:10px 0}.sbtn{justify-content:flex-start;gap:10px;color:var(--ink)}.sbtn span{overflow:hidden;text-overflow:ellipsis}
.or{display:flex;align-items:center;gap:10px;color:var(--mute);font-size:14px;margin:6px 0}.or::before,.or::after{content:'';flex:1;border-top:1px solid var(--line)}
.aform input,.aform select,.aform textarea,.promo input,#damt,#devq,#gsel,#gplan,.linkrow input{width:100%;font-size:16px;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);min-height:44px}
.aform input[type=checkbox]{width:22px;min-height:0}.aform input[type=range]{padding:0}.rowsb{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.meter{display:block;height:6px;background:var(--panel2);border-radius:6px;overflow:hidden}.meter i{display:block;height:100%;width:0;background:#d1342b;transition:width .2s}.meter i[data-s="2"]{background:#ffc23d}.meter i[data-s="3"],.meter i[data-s="4"]{background:#19a974}
.reccode{font:800 clamp(20px,5vw,28px) ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em;background:var(--panel2);padding:12px;border-radius:12px;text-align:center;overflow-wrap:anywhere}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:0 16px}.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(160px,100%),1fr));gap:0 16px}.full{grid-column:1/-1}.aform.row{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.aform.row .fld{flex:1 1 240px}
.fld.inline{margin:0;display:inline-grid}
/* pay */
.osum{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--panel2);border-radius:14px;padding:14px 16px;margin:8px 0 14px;flex-wrap:wrap}.osum small{display:block;color:var(--mute);font-weight:400;font-size:14px}.oamt{font-size:24px;white-space:nowrap}.oamt small{display:inline;font-size:14px}
.promo{border:1.5px dashed var(--line);border-radius:12px;padding:8px 12px;margin:10px 0}.promo summary{cursor:pointer;font-weight:600}.promo .row-btns{flex-wrap:nowrap}.promo .row-btns input{flex:1}
.pmeth{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}.pmeth span{font-size:13px;background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:3px 10px;white-space:nowrap}
.pdone{border-top:1px solid var(--line);margin-top:14px;padding-top:6px}.btn.appl{background:#111;border-color:#111}
.plans.four{max-width:1100px;grid-template-columns:repeat(auto-fit,minmax(min(230px,100%),1fr))}.price small{font-size:15px;color:var(--mute);font-weight:500}
.dons{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:14px;max-width:960px;margin:16px 0}.don{display:grid;gap:4px;align-content:center;text-align:left;background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:20px;cursor:pointer;color:var(--ink);font:inherit;min-height:110px}.don b{font-size:28px}.don small{color:var(--mute)}button.don:hover{border-color:var(--acc)}.don.custom{cursor:default}.don .row-btns{flex-wrap:nowrap}.don .row-btns input{flex:1}
.st-paid{background:#c7f2d4;color:#0b4a2a}.st-awaiting,.st-started{background:#ffe8a8;color:#5a4100}.st-refunded,.st-cancelled{background:#eee;color:#555}
/* account */
.ahead{display:flex;align-items:center;gap:14px}.ahead h1,.ahead h2{margin:0}.ahead p{margin:2px 0 0;overflow-wrap:anywhere}
.apane{padding-top:6px}.acards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(170px,100%),1fr));gap:12px;margin:10px 0 16px}.acard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:2px;min-width:0}.acard small{color:var(--mute)}.acard b{font-size:24px;overflow-wrap:anywhere}.acard span{font-size:13px;color:var(--mute)}
.conn{display:grid;gap:6px;max-width:520px}.acrow{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}.acrow span:first-of-type{flex:1}
.prog{height:12px;background:var(--panel2);border-radius:8px;overflow:hidden;max-width:520px}.prog i{display:block;height:100%;background:var(--acc)}
/* settings, share, manual */
.setgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr));gap:4px 24px}.setgrid h3{margin-top:12px}.setgrid select{width:100%;min-height:44px;font-size:16px;border-radius:10px;border:1.5px solid var(--line);background:var(--panel);padding:8px}
.linkrow{flex-wrap:nowrap}.linkrow input{flex:1}.sharegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(150px,100%),1fr));gap:8px;margin:14px 0}.shr{display:grid;align-content:center;min-height:48px;padding:8px 12px;border:1.5px solid var(--line);border-radius:12px;text-decoration:none;font-weight:600;color:var(--ink);background:var(--panel)}.shr:hover{border-color:var(--acc)}.shr small{font-weight:400;color:var(--mute);font-size:12px}
.toc{display:flex;flex-wrap:wrap;gap:6px 10px;margin:10px 0 18px}.toc a{background:var(--panel2);border-radius:99px;padding:4px 12px;text-decoration:none;font-weight:600;font-size:14px}.msec{scroll-margin-top:80px}.lb.keys td:first-child{width:40%}
.faq{border-bottom:1px solid var(--line);padding:10px 0}.faq summary{cursor:pointer;font-weight:600}
/* developer */
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr));gap:8px 28px}.hbars{display:grid;gap:5px}.hb{display:grid;grid-template-columns:minmax(0,9em) minmax(0,1fr) auto;gap:8px;align-items:center;font-size:14px}.hb span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hb i{display:block;height:14px;background:var(--acc);border-radius:4px;min-width:2px}.hb b{font-variant-numeric:tabular-nums}
.dtab{font-size:14px}.dtab th{text-align:left;white-space:nowrap;padding:6px 8px;border-bottom:2px solid var(--line)}.dtab td{padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}.dtab tr[data-u]{cursor:pointer}.dtab tr[data-u]:hover{background:var(--panel2)}.acts{display:flex;gap:4px}
.provtog{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(220px,100%),1fr))}.guide{margin-top:16px;background:var(--panel2);border-radius:12px;padding:10px 14px}.guide summary{cursor:pointer;font-weight:700}code{overflow-wrap:anywhere}
.arow{flex-wrap:wrap}
@media (max-width:1100px){.fcols{grid-template-columns:repeat(3,minmax(0,1fr))}.fbrand{grid-column:1/-1}}
@media (max-width:900px){.stbox{grid-template-columns:1fr}.sside{justify-self:center;width:min(420px,100%)}#shrbtn{display:none}}
@media (max-width:820px){#main{padding-bottom:0}.mcol{padding-bottom:76px}.musicbox #tracknext{display:none}}
@media (max-width:600px){.fcols{grid-template-columns:repeat(2,minmax(0,1fr))}.stiles{grid-template-columns:repeat(2,minmax(0,1fr))}.dlbtn{padding:0 10px;font-size:14px}.dlbtn .ic{display:none}.acctbtn{padding:0 12px;font-size:14px;max-width:110px}.acctbtn.in span{display:none}.acctbtn.in{padding:0 4px}#setbtn,#bell,.musicbox{width:auto}.tbtn{width:38px}.start{place-items:start center}.start h1{font-size:clamp(36px,11vw,56px)}.sbtns .btn{flex:1 1 auto}.kv{grid-template-columns:1fr}.kv dd{margin-bottom:6px}.promo .row-btns,.don .row-btns,.linkrow{flex-wrap:wrap}}
@media (max-width:420px){.brand span{display:none}.musicbox{display:none}#searchf{flex:1 1 60px}}@media (max-width:370px){#searchf{display:none}}
@media (max-height:520px) and (orientation:landscape){.start{place-items:start center}.stiles{display:none}.start h1{font-size:40px}}
@media(max-width:600px){.stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8em;text-align:start;white-space:normal}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;color:var(--mute)}.stack td:empty{display:none}}
.rboard{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(190px,100%),1fr));gap:6px;margin:0 0 10px;width:100%}.rrow{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;grid-template-rows:auto auto;column-gap:8px;align-items:center;background:#0003;color:#fff;border-radius:10px;padding:6px 10px;border-left:5px solid var(--c)}.rrow.me{background:#ffffff26;outline:2px solid var(--gold)}.rpos{font:800 18px Rubik;grid-row:span 2}.rrow i{width:10px;height:10px;border-radius:50%;background:var(--c);grid-row:span 2}.rname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}.rrow b{font:800 18px Rubik;text-align:right}.rrow small{grid-column:3/5;font-size:12px;opacity:.75}.rrow.done small{color:var(--gold);opacity:1}
.score2{flex-wrap:wrap;row-gap:4px;column-gap:12px}.ytab{display:block;overflow-x:auto;max-width:100%}
.rboard .rrow{background:var(--felt);box-shadow:0 2px 0 #0003}.rboard .rrow.me{background:#16805e}
.plans.three{max-width:980px;grid-template-columns:repeat(auto-fit,minmax(min(250px,100%),1fr))}
/* ===== Version 2 game design layer (html.v2). Version 1 = these rules switched off. ===== */
html.v2 .board{background:radial-gradient(120% 90% at 50% 0%,#167a5a 0%,#0f5a43 45%,#0a3f2f 100%);box-shadow:inset 0 0 0 1px #ffffff14,inset 0 2px 0 #ffffff1f,inset 0 0 80px #0007,0 18px 40px -18px #0009;border-radius:22px}
html.v2 .board::before{content:'';position:absolute;inset:8px;border-radius:16px;border:1px solid #ffc23d22;pointer-events:none}
html.v2 .mbar{background:linear-gradient(180deg,var(--panel),var(--panel2));box-shadow:0 2px 0 var(--line);font-weight:500}
html.v2 .mbar .turn{display:inline-flex;align-items:center;gap:8px;font-weight:700}html.v2 .mbar .turn::before{content:'';width:12px;height:12px;border-radius:50%;background:var(--c,var(--acc));box-shadow:0 0 0 4px color-mix(in srgb,var(--c,var(--acc)) 30%,transparent);animation:v2pulse 1.4s ease-in-out infinite}
@keyframes v2pulse{50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--c,var(--acc)) 10%,transparent)}}
/* chess-like boards */
html.v2 .ck,html.v2 .chess{box-shadow:0 0 0 6px #5b3a1e,0 0 0 9px #2c1a0b,0 20px 40px -12px #000a;border-radius:6px}
html.v2 .ck .lt,html.v2 .chess .lt{background:linear-gradient(135deg,#f3e2c3,#e8d0a8)}html.v2 .ck .dk,html.v2 .chess .dk{background:linear-gradient(135deg,#b88762,#9c6c47)}
html.v2 .chess .sel,html.v2 .ck .sel{background:radial-gradient(circle,#fff3a8,#e8c547)!important;box-shadow:inset 0 0 0 3px #b08a00}
html.v2 .chess .tg::after,html.v2 .ck .tg::after{background:radial-gradient(circle,#1d6b4f 0 45%,transparent 50%);width:34%;height:34%;opacity:.75}
html.v2 .cp{filter:drop-shadow(0 3px 2px #0007);transition:transform .15s}html.v2 .chess button:hover .cp{transform:translateY(-2px) scale(1.04)}
html.v2 .cp.w{color:#fffdf6;text-shadow:0 0 1px #000,0 0 1px #000,0 1px 0 #6b5a3a}html.v2 .cp.b{color:#1a1410;text-shadow:0 0 1px #fff8,0 1px 0 #fff4}
html.v2 .pc{background:radial-gradient(circle at 35% 30%,#ffffff55,transparent 45%),var(--pcb,#222)!important;box-shadow:inset 0 -5px 0 #0005,inset 0 0 0 4px #ffffff14,inset 0 0 0 7px #0002,0 4px 6px #0008}
html.v2 .pc.red{--pcb:#d23b2a}html.v2 .pc.blk{--pcb:#262626}html.v2 .pc.wht{--pcb:#f2efe6}
/* stones, discs */
html.v2 .st{background:radial-gradient(circle at 32% 28%,#ffffff90,transparent 38%),var(--stb,#151515)!important;box-shadow:0 3px 4px #0007,inset 0 -3px 3px #0004}html.v2 .st.s0{--stb:#141414}html.v2 .st.s1{--stb:#f5f4ee}
html.v2 .gs{filter:drop-shadow(0 .6px .5px #0008)}html.v2 .gs.g0{fill:url(#none);fill:#151515}html.v2 .goB .wood{fill:#deb36b}
html.v2 .c4,html.v2 .kg{background:linear-gradient(180deg,#2763d6,#173f99);box-shadow:inset 0 2px 0 #ffffff40,0 14px 30px -10px #000a}html.v2 .c4c{background:radial-gradient(circle at 50% 40%,#061a44,#0b2a66);box-shadow:inset 0 3px 6px #000a}
html.v2 .c4c i{box-shadow:inset 0 -5px 0 #0004,inset 0 4px 4px #ffffff40}
html.v2 .rv{background:linear-gradient(135deg,#0e4a36,#0a3628);box-shadow:inset 0 0 0 2px #00000040,0 12px 30px -12px #000b}
/* dice, tiles, pits, pegs */
html.v2 .die,html.v2 .bigdie{background:linear-gradient(145deg,#ffffff,#e9e6df);box-shadow:inset 0 -5px 0 #0002,inset 0 2px 0 #fff,0 6px 12px -4px #0008;transition:transform .2s}html.v2 .die i{background:radial-gradient(circle at 40% 35%,#555,#111)}
html.v2 .dbtn.held .die,html.v2 .die.held{transform:translateY(-6px);box-shadow:0 0 0 3px var(--gold),0 10px 16px -6px #000a}
html.v2 .tiles span,html.v2 .t48{box-shadow:inset 0 -5px 0 #0002,inset 0 2px 0 #fff6,0 4px 8px -3px #0006}
html.v2 .g48{background:linear-gradient(145deg,#c3ad94,#a8927a);box-shadow:inset 0 0 0 2px #0001,0 14px 30px -14px #000a}html.v2 .t48{transition:transform .12s}
html.v2 .pit{background:radial-gradient(circle at 50% 35%,#3a2210,#6b4220 70%);box-shadow:inset 0 6px 10px #000a,0 1px 0 #ffffff30}
html.v2 .hole{box-shadow:inset 0 3px 5px #000a,0 1px 0 #ffffff1a}html.v2 .tok{box-shadow:0 3px 5px #0008,inset 0 -3px 0 #0004,inset 0 2px 0 #ffffff60}
/* oriental & tafl boards */
html.v2 .shogi,html.v2 .tafl{box-shadow:0 0 0 5px #5b3a1e,0 18px 36px -14px #000b}html.v2 .shogi button,html.v2 .tafl button{background:linear-gradient(135deg,#f0d495,#dfbd78)}html.v2 .xq .wood{fill:#ecc985}
/* cards */
html.v2 button.card:not(.back){background:linear-gradient(160deg,#ffffff 0%,#f6f3ec 100%);border:1px solid #0002;box-shadow:inset 0 0 0 3px #fff,inset 0 0 0 4px #00000012,0 3px 0 #0002,0 8px 14px -8px #000a;border-radius:9px;transition:transform .15s,box-shadow .15s}
html.v2 button.card b{font-family:'Lilita One',Rubik,sans-serif;letter-spacing:.5px}html.v2 button.card.red{color:#c4251c}
html.v2 button.card:not([disabled]):hover{transform:translateY(-6px) rotate(-1deg);box-shadow:inset 0 0 0 3px #fff,0 14px 20px -10px #000c}
html.v2 button.card.ok{box-shadow:inset 0 0 0 3px #fff,0 0 0 3px var(--gold),0 10px 18px -8px #000c}
html.v2 button.card.back{background:radial-gradient(circle at 50% 50%,#ffffff22 0 18%,transparent 19%),repeating-linear-gradient(45deg,#c03424 0 6px,#9d2318 6px 12px);border:4px solid #fff;box-shadow:0 3px 0 #0003,0 8px 14px -8px #000a;border-radius:9px}
/* puzzles */
html.v2 .sd{border:3px solid #1b2a24;border-radius:10px;overflow:hidden;box-shadow:0 16px 30px -14px #000b}html.v2 .sd button{transition:background .12s}html.v2 .sd button:hover{background:#eef6ff}html.v2 .sd button.sel{background:#ffe9a8!important}html.v2 .sd .given{color:#1b2a24;font-weight:800}
html.v2 .tkz,html.v2 .akari,html.v2 .stb,html.v2 .flood,html.v2 .sgame,html.v2 .dmn,html.v2 .atx{box-shadow:0 16px 30px -14px #000b}
html.v2 .numpad .btn,html.v2 .row-btns .btn{box-shadow:0 2px 0 var(--line)}html.v2 .board .btn:active{transform:translateY(1px)}
/* arcade screen */
html.v2 .cvw{position:relative}html.v2 .cvw canvas{border-radius:16px;box-shadow:0 0 0 3px #0b1f18,0 0 0 6px #ffc23d55,0 24px 50px -16px #000c}
html.v2 .cvw::after{content:'';position:absolute;inset:0;margin:auto;max-width:min(600px,100%);border-radius:16px;pointer-events:none;background:linear-gradient(180deg,#ffffff12,transparent 18%),repeating-linear-gradient(0deg,#0000 0 3px,#00000010 3px 4px)}
html.v2 .gpad button{background:linear-gradient(180deg,#ffffff38,#ffffff18);box-shadow:inset 0 1px 0 #fff4,0 4px 0 #0004}html.v2 .gpad button:active{transform:translateY(3px);box-shadow:inset 0 1px 0 #fff4}
/* shared v2 gameplay chrome */
html.v2 .v2chg{animation:v2ring 1.1s ease-out both}@keyframes v2ring{from{box-shadow:inset 0 0 0 3px #ffc23dcc}to{box-shadow:inset 0 0 0 3px #ffc23d00}}
html.v2 .v2hint{outline:4px solid #7be0ff!important;outline-offset:-4px}
@keyframes v2pop{0%{transform:scale(.85)}100%{transform:scale(1)}}@keyframes v2flash{0%{opacity:.45}100%{opacity:0}}@keyframes v2hint{50%{outline-color:#fff}}@keyframes v2drop{from{transform:translateY(-240%)}to{transform:none}}@keyframes v2deal{from{transform:translateY(-14px) scale(.92);opacity:0}}
.v2tools{display:flex;gap:6px;margin-left:auto;align-items:center;flex-wrap:wrap}.v2tools .btn{min-height:36px;padding:4px 12px;font-size:14px}.v2stat{font-variant-numeric:tabular-nums;color:var(--mute);font-size:14px;white-space:nowrap}
.v2over{position:absolute;inset:0;z-index:8;display:grid;place-items:center;background:#0008;border-radius:inherit;backdrop-filter:blur(2px);animation:v2fade .3s}.v2over .v2card{background:var(--panel);color:var(--ink);border-radius:20px;padding:22px 28px;text-align:center;display:grid;gap:8px;box-shadow:0 30px 60px #000a;min-width:min(300px,86%);animation:v2fade .35s ease-out both}.v2card h3{font:400 30px 'Lilita One',Rubik;margin:0}.v2card.win h3{color:#e2412f}.v2card .row-btns{justify-content:center}
@keyframes v2fade{from{opacity:0}}
